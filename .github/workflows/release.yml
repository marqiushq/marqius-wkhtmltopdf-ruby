# Keeps marqius-wkhtmltopdf on RubyGems on the latest release, and proves it first:
#
#   every hour     when marqiushq/marqius-wkhtmltopdf has a newer release than the gem, each of its
#                  programs is checked against the release's SHA-256 and the build provenance GitHub
#                  signed for it, and a gem is made for each platform. Bundler installs them with the
#                  README's line in new projects on Linux (x86-64 and ARM64: Debian 13, Alpine and
#                  Ubuntu 24.04, Heroku-24's system, also as Heroku installs), macOS (Apple silicon)
#                  and Windows, where wicked_pdf and PDFKit make PDFs with them, and wicked_pdf's and
#                  PDFKit's own test suites run with them on Linux. Only then are they published,
#                  with attestations, the version committed and tagged, and the README's lines run
#                  again from RubyGems. An hour with no new release ends after that first check:
#                  there is nothing new to test.
#   by hand        Actions > Release > Run workflow: the same, now; it also publishes the gem's own
#                  release if RubyGems lacks it, which is how the first release goes out
#   on a change    to main, or in a pull request: the gem as it stands, on the same machines; a version
#                  RubyGems already has is tested as RubyGems serves it (Bundler rightly refuses a
#                  rebuilt gem of a version it knows, and a README change alone rebuilds them all)
#   publishing     only from a public repository whose variable PUBLISHING is "on", through RubyGems'
#                  trusted publishing (no token is stored); while private, the hourly check does not run
name: Release

on:
  schedule:
    - cron: "53 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearsal: build and test the latest marqius-wkhtmltopdf release as if it were new, even if RubyGems has it, without the macOS lane; publish nothing"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # a rehearsal neither waits behind a run that publishes nor takes its place
  group: release-${{ github.ref }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

jobs:
  follow:
    # while the repository is private, the hourly check does not run (it would spend private minutes)
    if: github.event_name != 'schedule' || !github.event.repository.private
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.follow.outputs.publish }}
      version: ${{ steps.follow.outputs.version }}
      published: ${{ steps.follow.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: follow
        name: Follow marqius-wkhtmltopdf's latest release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          have=$(sed -n 's/^  VERSION = "\(.*\)"$/\1/p' lib/marqius_wkhtmltopdf.rb)
          publish=false target=$have
          if [ "$DRY_RUN" = true ]; then
            # a rehearsal: the latest release, built and tested as if it were new; the publish job is skipped
            latest=$(python3 .github/release.py latest)
            publish=true target=$latest
          elif [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            latest=$(python3 .github/release.py latest)
            if python3 .github/release.py newer "$latest" "$have"; then
              publish=true target=$latest
            elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$(curl -fsS https://rubygems.org/api/v1/versions/marqius-wkhtmltopdf.json 2>/dev/null | jq --arg v "$have" '[.[] | select(.number == $v)] | length' 2>/dev/null)" != 5 ]; then
              publish=true # run by hand, and RubyGems lacks the gem's own release (or one of its five gems): the first one
            fi
          fi
          # all five gems of this version already on RubyGems: the examples take them from there
          published=false
          [ "$(curl -fsS https://rubygems.org/api/v1/versions/marqius-wkhtmltopdf.json 2>/dev/null | jq --arg v "$target" '[.[] | select(.number == $v)] | length' 2>/dev/null)" = 5 ] && published=true
          echo "gem $have, marqius-wkhtmltopdf ${latest:-not asked}: publish=$publish version=$target published=$published"
          printf 'publish=%s\nversion=%s\npublished=%s\n' "$publish" "$target" "$published" >>"$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.4"
      - name: Check the release's programs and make the gems
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.follow.outputs.version }}
        run: |
          python3 .github/release.py fetch "$VERSION" "$RUNNER_TEMP/builds"
          ruby build.rb "$VERSION" "$RUNNER_TEMP/builds" pkg
          (cd pkg && sha256sum ./*.gem)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gems
          path: pkg/*.gem
          retention-days: 7

  examples:
    # the README's lines as printed, in new projects: Bundler must choose the platform's gem, and
    # wicked_pdf and PDFKit make PDFs with it, found by themselves and named by executable_path
    needs: follow
    # every hour, only when there is a release to publish: the other hours have nothing new to test
    if: github.event_name != 'schedule' || needs.follow.outputs.publish == 'true'
    name: examples (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x86-64, Debian 13", runner: ubuntu-24.04, image: "ruby:3.4-trixie", nofonts: "ruby:3.4-slim-trixie", platform: x86_64-linux }
          - { name: "Linux x86-64, Alpine", runner: ubuntu-24.04, image: "ruby:4.0-alpine", nofonts: "ruby:4.0-alpine", platform: x86_64-linux }
          - { name: "Linux x86-64, Ruby 2.7", runner: ubuntu-24.04, image: "ruby:2.7", platform: x86_64-linux }
          - { name: "Linux x86-64, Ubuntu 24.04", runner: ubuntu-24.04, ruby: "3.3", platform: x86_64-linux }
          - { name: "Linux x86-64, Ubuntu 24.04, installed as Heroku installs", runner: ubuntu-24.04, ruby: "3.3", platform: x86_64-linux, heroku: "yes" }
          - { name: "Linux ARM64, Debian 13", runner: ubuntu-24.04-arm, image: "ruby:3.4-trixie", nofonts: "ruby:3.4-slim-trixie", platform: aarch64-linux }
          - { name: "Linux ARM64, Alpine", runner: ubuntu-24.04-arm, image: "ruby:4.0-alpine", nofonts: "ruby:4.0-alpine", platform: aarch64-linux }
          - { name: "Linux ARM64, Ubuntu 24.04", runner: ubuntu-24.04-arm, ruby: "3.3", platform: aarch64-linux }
          # macOS (Apple silicon): the examples-macos job, so that a rehearsal can leave it out
          - { name: "Windows x64", runner: windows-2025, ruby: "3.4", platform: x64-mingw-ucrt, zero: "no" }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitHub's Intel Ubuntu machines download from a slow mirror (the README's 75 MB of fonts took
      # 7 to 13 minutes there): the packages earlier runs downloaded go where apt looks first. apt
      # still checks each one against its index, and downloads any that changed.
      - name: Packages earlier runs downloaded, where apt looks first
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-archives-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: apt-archives-${{ runner.arch }}-
      - if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-archives
          n=$(find ~/apt-archives -maxdepth 1 -name '*.deb' | wc -l)
          if [ "$n" -gt 0 ]; then sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/; fi
          echo "$n packages from earlier runs"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gems
          path: pkg
      - name: No wkhtmltopdf on this machine before the gem
        run: |
          if command -v wkhtmltopdf; then echo "::error::this machine already has a wkhtmltopdf"; exit 1; fi
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get -q update && sudo apt-get -q install -y --no-install-recommends poppler-utils fonts-dejavu-core; fi
      - if: matrix.image != ''
        name: In a new ${{ matrix.image }} container, given this machine's fonts
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          # the gems made here, or none where RubyGems already has this version: then RubyGems' own
          GEMS: ${{ needs.follow.outputs.published != 'true' && '/w/pkg' || '' }}
        run: |
          # the image as it is, with the fonts this machine installed above (read-only); on Alpine,
          # also the compilers that some of activesupport's gems build with, as Alpine apps install
          docker run --rm -e GEMS -e PLATFORM -v /usr/share/fonts:/usr/share/fonts:ro \
            -v "$GITHUB_WORKSPACE:/w" -w /w "$IMAGE" sh -c '
            set -e
            if command -v apk >/dev/null; then apk add --no-cache -q build-base; fi
            sh tests/examples.sh /w/work'
          # the PDFs it made must read Invoice 42 (pdftotext runs here, outside the container)
          for f in work/*/zero.pdf work/*/invoice.pdf; do
            pdftotext "$f" - | grep -q 'Invoice 42' || { echo "::error::$f does not read Invoice 42"; exit 1; }
            echo "reads Invoice 42: $f"
          done
      - if: matrix.nofonts != ''
        name: In a new ${{ matrix.nofonts }} container without fonts, the program prints the line that installs them
        env:
          IMAGE: ${{ matrix.nofonts }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # this machine's gem by its file: `gem install --local NAME` in a folder of every platform's
          # gems takes any one of them (RubyGems.org and Bundler choose by platform)
          docker run --rm -e PLATFORM -v "$GITHUB_WORKSPACE/pkg:/pkg:ro" "$IMAGE" sh -c '
            gem install --local --no-document /pkg/marqius-wkhtmltopdf-*-"$PLATFORM".gem && cd /tmp &&
            echo "<h1>Invoice 42</h1>" >a.html && wkhtmltopdf a.html a.pdf' >nofonts.log 2>&1 || true
          cat nofonts.log
          grep -E 'apk add|apt-get install|apt install' nofonts.log || { echo "::error::no line that installs fonts"; exit 1; }
      - if: matrix.ruby != ''
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - if: matrix.ruby != ''
        name: With Ruby ${{ matrix.ruby }} on the machine itself
        env:
          PLATFORM: ${{ matrix.platform }}
          ZERO_CONFIG: ${{ matrix.zero || 'yes' }}
          HEROKU: ${{ matrix.heroku || 'no' }}
          PUBLISHED: ${{ needs.follow.outputs.published }}
        run: |
          work=$RUNNER_TEMP/work gems=$GITHUB_WORKSPACE/pkg
          if command -v cygpath >/dev/null; then work=$(cygpath -m "$work") gems=$(cygpath -m "$gems"); fi
          # a version RubyGems already has: its own gems, as the README's lines get them
          [ "$PUBLISHED" = true ] && gems=
          libraries="pdfkit wicked_pdf wicked_pdf-2.7 plain"
          [ "$RUNNER_OS" = Windows ] && libraries="pdfkit wicked_pdf wicked_pdf-2.7"
          # the README's eight-language invoice, after its fonts line on Ubuntu (not on a frozen Heroku-style bundle)
          [ "$HEROKU" = yes ] || libraries="$libraries languages"
          GEMS=$gems sh tests/examples.sh "$work" $libraries
      - name: Keep the packages this run downloaded, for the next run
        id: apt-keep
        if: always() && runner.os == 'Linux'
        run: |
          new=0
          for f in /var/cache/apt/archives/*.deb; do
            [ -e "$f" ] || continue
            [ -e ~/apt-archives/"${f##*/}" ] && continue
            cp "$f" ~/apt-archives/ && new=$((new + 1))
          done
          echo "$new packages new to the cache"
          echo "new=$new" >>"$GITHUB_OUTPUT"
      - if: always() && runner.os == 'Linux' && steps.apt-keep.outputs.new != '' && steps.apt-keep.outputs.new != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-archives-${{ runner.arch }}-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}

  examples-macos:
    # the examples' macOS (Apple silicon) lane, as its own job: a rehearsal publishes nothing and leaves
    # it out (GitHub often has no Mac to give); publishing needs it, as before
    needs: follow
    if: (github.event_name != 'schedule' || needs.follow.outputs.publish == 'true') && !inputs.dry_run
    name: examples (macOS, Apple silicon)
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gems
          path: pkg
      - name: No wkhtmltopdf on this machine before the gem
        run: |
          if command -v wkhtmltopdf; then echo "::error::this machine already has a wkhtmltopdf"; exit 1; fi
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "4.0"
      - name: With Ruby 4.0 on the machine itself
        env:
          PLATFORM: arm64-darwin
          ZERO_CONFIG: "yes"
          HEROKU: "no"
          PUBLISHED: ${{ needs.follow.outputs.published }}
        run: |
          work=$RUNNER_TEMP/work gems=$GITHUB_WORKSPACE/pkg
          # a version RubyGems already has: its own gems, as the README's lines get them
          [ "$PUBLISHED" = true ] && gems=
          GEMS=$gems sh tests/examples.sh "$work" pdfkit wicked_pdf wicked_pdf-2.7 plain languages

  suites:
    # wicked_pdf's and PDFKit's own test suites, as github.com/marqiushq/wkhtmltopdf-library-tests
    # runs them, with the gem as their wkhtmltopdf
    needs: follow
    # every hour, only when there is a release to publish: the other hours have nothing new to test
    if: github.event_name != 'schedule' || needs.follow.outputs.publish == 'true'
    name: suites (${{ matrix.library }}, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        library: [wicked_pdf, pdfkit]
        include:
          - { library: wicked_pdf, ruby: "3.2", apt: libsqlite3-dev }
          - { library: pdfkit, ruby: "3.1", apt: "" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitHub's Intel Ubuntu machines download from a slow mirror (the README's 75 MB of fonts took
      # 7 to 13 minutes there): the packages earlier runs downloaded go where apt looks first. apt
      # still checks each one against its index, and downloads any that changed.
      - name: Packages earlier runs downloaded, where apt looks first
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-archives-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: apt-archives-${{ runner.arch }}-
      - if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-archives
          n=$(find ~/apt-archives -maxdepth 1 -name '*.deb' | wc -l)
          if [ "$n" -gt 0 ]; then sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/; fi
          echo "$n packages from earlier runs"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gems
          path: pkg
      - name: Fonts (as library-tests installs them), and what the library's own CI installs
        env:
          APT: ${{ matrix.apt }}
        run: |
          if command -v wkhtmltopdf; then echo "::error::this machine already has a wkhtmltopdf"; exit 1; fi
          sudo apt-get -q update
          # shellcheck disable=SC2086
          sudo apt-get -q install -y --no-install-recommends fontconfig fonts-dejavu-core fonts-liberation $APT
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: ${{ matrix.library }}'s own tests, with the gem
        env:
          LIBRARY: ${{ matrix.library }}
        run: GEMS=$GITHUB_WORKSPACE/pkg bash tests/suites.sh "$LIBRARY" "$RUNNER_TEMP/suites"
      - name: Keep the packages this run downloaded, for the next run
        id: apt-keep
        if: always() && runner.os == 'Linux'
        run: |
          new=0
          for f in /var/cache/apt/archives/*.deb; do
            [ -e "$f" ] || continue
            [ -e ~/apt-archives/"${f##*/}" ] && continue
            cp "$f" ~/apt-archives/ && new=$((new + 1))
          done
          echo "$new packages new to the cache"
          echo "new=$new" >>"$GITHUB_OUTPUT"
      - if: always() && runner.os == 'Linux' && steps.apt-keep.outputs.new != '' && steps.apt-keep.outputs.new != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-archives-${{ runner.arch }}-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}

  publish:
    needs: [follow, examples, examples-macos, suites]
    if: >-
      needs.follow.outputs.publish == 'true' && github.ref == 'refs/heads/main' &&
      vars.PUBLISHING == 'on' && !github.event.repository.private && !inputs.dry_run
    runs-on: ubuntu-24.04
    environment: rubygems
    permissions:
      contents: write # the version's commit and tag
      id-token: write # RubyGems' trusted publishing, and the signatures of the attestations
      attestations: write # GitHub's build provenance for each gem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gems
          path: pkg
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.4"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pkg/*.gem
      - name: Trusted publishing, naming the gem's owner
        # GitHub's OIDC token, exchanged for a RubyGems key that can push for 15 minutes. The first
        # push, which creates the gem, must name the RubyGems account that set up the pending trusted
        # publisher (its immutable ID, shown on that page); rubygems/configure-rubygems-credentials
        # v2.1.0 cannot pass it yet, so the exchange is made here, as RubyGems.org's API documents it
        env:
          OWNER: "256575"
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)
          answer=$(jq -n --arg jwt "$jwt" --arg owner "$OWNER" '{jwt: $jwt, owner: $owner}' |
            curl -fsS -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
              -H "Content-Type: application/json" --data-binary @-)
          key=$(echo "$answer" | jq -r .rubygems_api_key)
          [ -n "$key" ] && [ "$key" != null ] || { echo "::error::RubyGems gave no key"; exit 1; }
          echo "::add-mask::$key"
          echo "GEM_HOST_API_KEY=$key" >>"$GITHUB_ENV"
          echo "$answer" | jq '{name, scopes, gem, owner, expires_at}'
      - name: Push each gem to RubyGems, with its Sigstore attestation
        env:
          VERSION: ${{ needs.follow.outputs.version }}
        run: |
          have=$(curl -fsS https://rubygems.org/api/v1/versions/marqius-wkhtmltopdf.json 2>/dev/null || echo '[]')
          for gem in pkg/*.gem; do
            platform=$(basename "$gem" .gem | sed "s/^marqius-wkhtmltopdf-$VERSION-\{0,1\}//")
            if [ "$(echo "$have" | jq --arg v "$VERSION" --arg p "${platform:-ruby}" '[.[] | select(.number == $v and .platform == $p)] | length')" != 0 ]; then
              echo "already on RubyGems: $gem"
              continue
            fi
            gem exec sigstore-cli:0.2.3 sign "$gem" --bundle "$gem.sigstore.json"
            gem push "$gem" --attestation "$gem.sigstore.json"
          done
      - name: Commit and tag the release that passed
        env:
          VERSION: ${{ needs.follow.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sed -i "s/^  VERSION = \".*\"$/  VERSION = \"$VERSION\"/" lib/marqius_wkhtmltopdf.rb
          grep -qx "  VERSION = \"$VERSION\"" lib/marqius_wkhtmltopdf.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- lib/marqius_wkhtmltopdf.rb; then
            git add lib/marqius_wkhtmltopdf.rb
            git commit -q -m "marqius-wkhtmltopdf $VERSION" -m "Installed with Bundler and run through wicked_pdf and PDFKit on Linux (x86-64, ARM64), macOS (Apple silicon) and Windows, their own test suites passed on Linux, then published: $RUN_URL"
          fi
          if [ -z "$(git ls-remote --tags origin "refs/tags/$VERSION")" ]; then
            git tag -a "$VERSION" -m "marqius-wkhtmltopdf $VERSION" -m "Tested and published: $RUN_URL"
            git push -q origin "refs/tags/$VERSION"
          fi
          git push -q origin HEAD:main

  live:
    needs: [follow, publish]
    name: live (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: x86_64-linux }
          - { runner: ubuntu-24.04-arm, platform: aarch64-linux }
          - { runner: macos-15, platform: arm64-darwin }
          - { runner: windows-2025, platform: x64-mingw-ucrt, zero: "no" }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.follow.outputs.version }}
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.4"
      - name: Wait for RubyGems to serve the release
        env:
          VERSION: ${{ needs.follow.outputs.version }}
        run: |
          for _ in $(seq 120); do
            gem list --remote --exact --all marqius-wkhtmltopdf 2>/dev/null | grep -q "[( ,]$VERSION[,) ]" && exit 0
            sleep 10
          done
          echo "RubyGems does not serve marqius-wkhtmltopdf $VERSION after 20 minutes" >&2
          exit 1
      - name: The README's lines, as printed, from RubyGems
        env:
          PLATFORM: ${{ matrix.platform }}
          ZERO_CONFIG: ${{ matrix.zero || 'yes' }}
        run: |
          work=$RUNNER_TEMP/live
          if command -v cygpath >/dev/null; then work=$(cygpath -m "$work"); fi
          sh tests/examples.sh "$work" pdfkit wicked_pdf wicked_pdf-2.7
